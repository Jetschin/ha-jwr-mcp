name: "iCloud MCP"
description: "Claude connector for your iCloud Drive (read, optionally write)"
version: "1.2.0"
slug: "icloud_mcp"
url: "https://github.com/Jetschin/ha-jwr-mcp"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8098
panel_icon: mdi:apple-icloud
panel_title: iCloud
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  apple_id: ""
  language: en
  allow_write: false
  external_url: ""
  client_key: ""
  max_read_mb: 50
  rotate_secret: false
  log_level: info
schema:
  apple_id: str?
  language: list(en|de)
  allow_write: bool
  external_url: str?
  client_key: password?
  max_read_mb: int(1,200)
  rotate_secret: bool
  log_level: list(debug|info|warning|error)
